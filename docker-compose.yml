# librefs object storage
# SeaweedFS 4.47 (Apache-2.0). One master, one volume server, filer + S3 gateway.
# Replication is 000: this host stores a single copy. Add volume servers before
# raising replication, or writes will block waiting for replicas that do not exist.

name: librefs-object-storage

x-image: &image chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  render-s3-config:
    image: *image
    entrypoint: ["/bin/sh", "-c"]
    user: "0:0"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - ${DATA_DIR:-./data}/config:/config
    command:
      - |
        set -eu
        printf '%s' "$$S3_ACCESS_KEY" | grep -Eq '^[A-Za-z0-9]{16,128}$'
        printf '%s' "$$S3_SECRET_KEY" | grep -Eq '^[A-Za-z0-9]{16,128}$'
        umask 077
        cat > /config/s3.json <<EOF
        {
          "identities": [
            {
              "name": "librefs",
              "credentials": [
                {
                  "accessKey": "$$S3_ACCESS_KEY",
                  "secretKey": "$$S3_SECRET_KEY"
                }
              ],
              "actions": ["Admin", "Read", "List", "Tagging", "Write"]
            }
          ]
        }
        EOF
        chown 1000:1000 /config/s3.json
        chmod 600 /config/s3.json
    restart: "no"
    logging: *logging
    networks:
      - storage

  master:
    image: *image
    command:
      - master
      - -ip=master
      - -ip.bind=0.0.0.0
      - -peers=none
      - -defaultReplication=000
      - -volumeSizeLimitMB=${VOLUME_SIZE_LIMIT_MB:-10240}
      - -metricsPort=9324
      - -telemetry=false
    volumes:
      - ${DATA_DIR:-./data}/master:/data
      - ./config/master.toml:/etc/seaweedfs/master.toml:ro
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: *logging
    networks:
      - storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MASTER_MEMORY_LIMIT:-1g}

  volume:
    image: *image
    command:
      - volume
      - -master=master:9333
      - -ip=volume
      - -ip.bind=0.0.0.0
      - -port=8080
      - -index=leveldb
      - -dataCenter=dc1
      - -rack=rack1
      - -compactionMBps=64
      - -minFreeSpace=10
      - -metricsPort=9325
    volumes:
      - ${DATA_DIR:-./data}/volume:/data
    depends_on:
      master:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: *logging
    networks:
      - storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${VOLUME_MEMORY_LIMIT:-4g}

  filer:
    image: *image
    command:
      - filer
      - -master=master:9333
      - -ip=filer
      - -ip.bind=0.0.0.0
      - -dataCenter=dc1
      - -rack=rack1
      - -port=8888
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3/s3.json
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -metricsPort=9326
    ports:
      - "${S3_BIND:-127.0.0.1}:${S3_PORT:-8333}:8333"
    volumes:
      - ${DATA_DIR:-./data}/filer:/data
      - ${DATA_DIR:-./data}/config:/etc/seaweedfs/s3:ro
    depends_on:
      render-s3-config:
        condition: service_completed_successfully
      master:
        condition: service_healthy
      volume:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: *logging
    networks:
      - storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8888/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${FILER_MEMORY_LIMIT:-2g}

  admin:
    image: *image
    command:
      - -logtostderr=true
      - admin
      - -master=master:9333
      - -ip=0.0.0.0
      - -port=23646
      - -dataDir=/data
      - -iceberg.port=0
      - -lance.port=0
    environment:
      WEED_ADMIN_USER: ${WEED_ADMIN_USER:-admin}
      WEED_ADMIN_PASSWORD: ${WEED_ADMIN_PASSWORD:-}
    ports:
      - "${ADMIN_BIND:-${S3_BIND:-127.0.0.1}}:${ADMIN_PORT:-23646}:23646"
    volumes:
      - ${DATA_DIR:-./data}/admin:/data
    depends_on:
      master:
        condition: service_healthy
      filer:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:23646/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  storage:
    name: librefs-storage
